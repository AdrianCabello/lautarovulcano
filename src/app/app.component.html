<div class="app-shell relative min-h-screen" appPageTranslation>
  <div class="app-background" aria-hidden="true"></div>

  <div class="relative z-10">
    <div class="min-h-screen flex flex-col">
      <nav class="site-nav fixed top-0 left-0 right-0 z-50 border-b border-white/[0.035] bg-[#03100c]/35 backdrop-blur-md"
        [class.site-nav--compact]="isNavCompact">
        <div class="container mx-auto px-4">
          <div class="site-nav__inner flex items-center justify-between h-14 md:h-16">
            <a routerLink="/" class="font-display text-xl font-bold leading-none text-white transition-colors hover:text-accent" data-testid="app-logo">LV</a>
            <div class="hidden items-center space-x-5 text-[0.64rem] font-semibold uppercase tracking-[0.15em] md:flex lg:space-x-7 lg:text-[0.68rem] lg:tracking-[0.18em]">
              <a routerLink="/" fragment="services" class="nav-link text-gray-400/80 transition-colors hover:text-white" [class.nav-link--active]="activeSection === 'services'" data-testid="app-services-link">Qué hago</a>
              <a routerLink="/" fragment="portfolio" class="nav-link text-gray-400/80 transition-colors hover:text-white" [class.nav-link--active]="activeSection === 'portfolio'" data-testid="app-portfolio-link">Trabajos</a>
              <a routerLink="/" fragment="about" class="nav-link text-gray-400/80 transition-colors hover:text-white" [class.nav-link--active]="activeSection === 'about'" data-testid="app-about-link">Sobre mí</a>
              <a routerLink="/" fragment="contact" class="nav-link text-gray-400/80 transition-colors hover:text-white" [class.nav-link--active]="activeSection === 'contact'" data-testid="app-contact-link">Contacto</a>
              <a routerLink="/" fragment="contact" class="nav-cta inline-flex items-center justify-center rounded-full border border-white/10 bg-white/[0.015] px-4 py-2 text-accent/90 transition-colors hover:border-accent/30 hover:bg-accent/10 hover:text-accent" data-testid="app-cta-link">Hablemos</a>
              <button
                type="button"
                (click)="toggleLanguage()"
                class="inline-flex h-8 items-center justify-center gap-1.5 rounded-full border border-white/10 bg-white/[0.015] px-2.5 text-white/75 transition-colors hover:border-accent/30 hover:bg-accent/10 hover:text-accent"
                [attr.aria-label]="language.current() === 'es' ? 'Cambiar sitio a inglés' : 'Switch site to Spanish'"
                [attr.title]="language.current() === 'es' ? 'English' : 'Español'"
                data-testid="app-language-toggle">
                <lucide-icon name="languages" [size]="14"></lucide-icon>
                <span>{{ language.current() === 'es' ? 'EN' : 'ES' }}</span>
              </button>
            </div>
            <div class="flex items-center gap-3 md:hidden">
              <button
                type="button"
                (click)="toggleLanguage()"
                class="inline-flex h-8 items-center justify-center gap-1.5 rounded-full border border-white/10 px-2.5 text-[0.68rem] font-bold text-white/75 transition-colors hover:border-accent/30 hover:text-accent"
                [attr.aria-label]="language.current() === 'es' ? 'Cambiar sitio a inglés' : 'Switch site to Spanish'"
                [attr.title]="language.current() === 'es' ? 'English' : 'Español'"
                data-testid="app-mobile-language-toggle">
                <lucide-icon name="languages" [size]="14"></lucide-icon>
                <span>{{ language.current() === 'es' ? 'EN' : 'ES' }}</span>
              </button>
              <button (click)="toggleMobileMenu()" class="text-gray-300 transition-colors hover:text-white" aria-label="Abrir menú" data-testid="app-mobile-menu-button">
                <lucide-icon [name]="isMobileMenuOpen ? 'x' : 'menu'" [size]="24"></lucide-icon>
              </button>
            </div>
          </div>
          <!-- Mobile menu -->
          <div class="md:hidden" [class.hidden]="!isMobileMenuOpen">
            <div class="space-y-1 border-t border-white/[0.06] px-2 pb-4 pt-3 text-sm font-semibold">
              <a routerLink="/" fragment="services" (click)="toggleMobileMenu()" class="block rounded-2xl px-3 py-2 text-gray-300 transition-colors hover:bg-white/[0.04] hover:text-white" data-testid="app-mobile-services-link">Qué hago</a>
              <a routerLink="/" fragment="portfolio" (click)="toggleMobileMenu()" class="block rounded-2xl px-3 py-2 text-gray-300 transition-colors hover:bg-white/[0.04] hover:text-white" data-testid="app-mobile-portfolio-link">Trabajos</a>
              <a routerLink="/" fragment="about" (click)="toggleMobileMenu()" class="block rounded-2xl px-3 py-2 text-gray-300 transition-colors hover:bg-white/[0.04] hover:text-white" data-testid="app-mobile-about-link">Sobre mí</a>
              <a routerLink="/" fragment="contact" (click)="toggleMobileMenu()" class="block rounded-2xl px-3 py-2 text-gray-300 transition-colors hover:bg-white/[0.04] hover:text-white" data-testid="app-mobile-contact-link">Contacto</a>
              <a routerLink="/" fragment="contact" (click)="toggleMobileMenu()" class="block rounded-2xl px-3 py-2 text-accent transition-colors hover:bg-accent/10 hover:text-accent/80" data-testid="app-mobile-cta-link">Hablemos</a>
            </div>
          </div>
        </div>
      </nav>

      <router-outlet></router-outlet>
    </div>
  </div>
</div>
